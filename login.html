<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUT CMMS - เข้าสู่ระบบ</title>

  <!-- Google Fonts & Central CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
      padding: 16px;
    }

    .login-container {
      max-width: 390px;
      width: 100%;
      text-align: center;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(16px);
    }

    .login-logo {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;
      margin: 0 auto 16px;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    /* Form Styles */
    .login-form {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group-login {
      margin-bottom: 14px;
    }

    .form-group-login label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-wrapper .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 14px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .login-input {
      width: 100%;
      height: 44px;
      padding: 10px 40px 10px 40px;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .login-input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.15);
    }

    .login-input:focus + .input-icon,
    .input-icon-wrapper:focus-within .input-icon {
      color: var(--primary);
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .pwd-toggle-btn:hover {
      color: var(--text-main);
    }

    .btn-login-username {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 44px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      margin-top: 6px;
    }

    .btn-login-username:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .btn-login-username:active {
      transform: scale(0.99);
    }

    /* Divider */
    .login-divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #94a3b8;
      font-size: 11.5px;
    }

    .login-divider::before,
    .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .login-divider span {
      padding: 0 12px;
      font-weight: 500;
    }

    /* LINE Button */
    .login-btn-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 44px;
      background: #06C755;
      color: white;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(6, 199, 85, 0.3);
    }

    .login-btn-line:hover {
      background: #05b34a;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(6, 199, 85, 0.4);
    }

    .login-btn-line:active {
      transform: scale(0.99);
    }

    .login-btn-line svg {
      flex-shrink: 0;
    }

    /* Alert Message */
    .login-alert {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 12px;
      margin-bottom: 14px;
      text-align: left;
      align-items: flex-start;
      gap: 8px;
      animation: fadeInAlert 0.2s ease-out;
    }

    @keyframes fadeInAlert {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-notice {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: left;
      align-items: center;
      gap: 8px;
    }

    .login-notice.warning {
      background: #fffbeb;
      border-color: #fde68a;
      color: #b45309;
    }

    .login-hint {
      margin-top: 18px;
      padding: 10px 12px;
      background: #f0f9ff;
      border: 1px solid #e0f2fe;
      border-radius: 10px;
      font-size: 11px;
      color: #0369a1;
      line-height: 1.5;
      text-align: left;
    }

    .login-hint i {
      margin-right: 4px;
      color: #0284c7;
    }

    .login-footer {
      margin-top: 20px;
      font-size: 11px;
      color: #94a3b8;
    }

    .loading-spinner-small {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-loading {
      pointer-events: none;
      opacity: 0.85;
    }

    .btn-loading .loading-spinner-small {
      display: inline-block;
    }

    .btn-loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <i class="fa-solid fa-wrench"></i>
      </div>

      <!-- Title -->
      <h1 class="login-title">AUT CMMS</h1>
      <p class="login-subtitle">Smart Maintenance Service System</p>

      <!-- Redirect Notice Box -->
      <div id="loginNotice" class="login-notice">
        <i id="loginNoticeIcon" class="fa-solid fa-circle-info"></i>
        <span id="loginNoticeText">กรุณาเข้าสู่ระบบ</span>
      </div>

      <!-- Alert Box -->
      <div id="loginAlert" class="login-alert">
        <i class="fa-solid fa-circle-exclamation" style="margin-top: 2px;"></i>
        <span id="loginAlertText">ข้อความแจ้งเตือน</span>
      </div>

      <!-- Username / Password Login Form -->
      <form id="credentialsLoginForm" class="login-form" onsubmit="handleCredentialsLogin(event)">
        <div class="form-group-login">
          <label for="inputUsername">ชื่อผู้ใช้งาน (Username):</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input
              type="text"
              id="inputUsername"
              class="login-input"
              placeholder="ระบุชื่อผู้ใช้งาน"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group-login">
          <label for="inputPassword">รหัสผ่าน (Password):</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              type="password"
              id="inputPassword"
              class="login-input"
              placeholder="ระบุรหัสผ่าน"
              autocomplete="current-password"
              required
            />
            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="แสดง/ซ่อนรหัสผ่าน">
              <i id="togglePwdIcon" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnCredentialsLogin" class="btn-login-username">
          <div class="loading-spinner-small"></div>
          <span class="btn-text">
            <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 4px;"></i> เข้าสู่ระบบด้วย Username
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="login-divider">
        <span>หรือเข้าสู่ระบบด้วย LINE</span>
      </div>

      <!-- LINE Login Button -->
      <button type="button" id="btnLineLogin" class="login-btn-line" onclick="loginWithLine()">
        <div class="loading-spinner-small"></div>
        <span class="btn-text" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
            <path d="M12 2C6.48 2 2 5.82 2 10.5c0 4.01 3.44 7.39 8.09 8.27.31.07.74.21.85.48.1.24.06.61.03.85l-.15.86c-.05.26-.21 1.01.88.55.56-.24 9.11-5.35 9.11-9.71C21.68 5.82 17.52 2 12 2zm-3.2 6.4c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm6.4 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
          </svg>
          เข้าสู่ระบบด้วย LINE
        </span>
      </button>

      <!-- Hint -->
      <div class="login-hint">
        <i class="fa-solid fa-circle-info"></i>
        สำหรับการสแกน QR Code เพื่อเปิดใบแจ้งซ่อม แนะนำให้เปิดผ่านแอป <strong>LINE</strong>
      </div>
    </div>

    <!-- Footer -->
    <p class="login-footer">AUT CMMS v1.0 &copy; 2026</p>
  </div>

  <!-- Shared Scripts -->
  <script src="js/api.js"></script>
  <script src="js/liff-auth.js"></script>

  <script>
    const LIFF_ID = "2011050588-FTDVMv4L";

    function getRedirectUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const red = params.get("redirect");
        if (red) {
          // ป้องกัน Open Redirect
          const clean = decodeURIComponent(red).replace(/^[\/\\]+/, "");
          if (!clean.startsWith("http://") && !clean.startsWith("https://") && !clean.startsWith("//")) {
            return clean;
          }
        }
      } catch (e) {}
      return "index.html";
    }

    function checkRedirectNotice() {
      const params = new URLSearchParams(window.location.search);
      const red = params.get("redirect") || "";
      const noticeBox = document.getElementById("loginNotice");
      const noticeText = document.getElementById("loginNoticeText");
      const noticeIcon = document.getElementById("loginNoticeIcon");

      if (red.includes("create-ticket")) {
        noticeBox.className = "login-notice warning";
        noticeIcon.className = "fa-solid fa-triangle-exclamation";
        noticeText.textContent = "กรุณาเข้าสู่ระบบก่อนทำการแจ้งซ่อม";
        noticeBox.style.display = "flex";
      } else if (red.includes("profile")) {
        noticeBox.className = "login-notice";
        noticeIcon.className = "fa-solid fa-circle-info";
        noticeText.textContent = "กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูลโปรไฟล์";
        noticeBox.style.display = "flex";
      }
    }

    function showLoginAlert(msg) {
      const el = document.getElementById("loginAlert");
      const txt = document.getElementById("loginAlertText");
      txt.textContent = msg;
      el.style.display = "flex";
    }

    function hideLoginAlert() {
      document.getElementById("loginAlert").style.display = "none";
    }

    function togglePasswordVisibility() {
      const input = document.getElementById("inputPassword");
      const icon = document.getElementById("togglePwdIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    /**
     * เข้าสู่ระบบด้วย Username / Password
     */
    async function handleCredentialsLogin(e) {
      e.preventDefault();
      hideLoginAlert();

      const username = document.getElementById("inputUsername").value.trim();
      const password = document.getElementById("inputPassword").value;

      if (!username || !password) {
        showLoginAlert("กรุณาระบุ Username และ Password ให้ครบถ้วน");
        return;
      }

      const btn = document.getElementById("btnCredentialsLogin");
      btn.classList.add("btn-loading");
      btn.disabled = true;

      try {
        const res = await CmmsApi.checkUserLogin(username, password);

        if (res && res.status === "success" && res.data) {
          // บันทึก Session เข้าสู่ระบบ
          LiffAuth.loginWithCredentials(res.data);
          window.location.href = getRedirectUrl();
          return;
        }

        const errMsg = (res && res.message) || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
        showLoginAlert(errMsg);
      } catch (err) {
        console.error("Credentials Login error:", err);
        showLoginAlert(err.message || "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
      } finally {
        btn.classList.remove("btn-loading");
        btn.disabled = false;
      }
    }

    /**
     * เข้าสู่ระบบด้วย LINE LIFF
     */
    async function loginWithLine() {
      const btn = document.getElementById("btnLineLogin");
      btn.classList.add("btn-loading");
      btn.disabled = true;

      try {
        if (typeof liff === "undefined") {
          throw new Error("ไม่สามารถโหลด LINE LIFF SDK ได้ กรุณาเชื่อมต่ออินเทอร์เน็ต");
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          window.location.href = getRedirectUrl();
        }
      } catch (err) {
        console.error("LINE Login error:", err);
        showLoginAlert(err.message || "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
        btn.classList.remove("btn-loading");
        btn.disabled = false;
      }
    }

    // เมื่อโหลดหน้า ตรวจสอบว่าเคยเข้าสู่ระบบแล้วหรือไม่
    window.addEventListener("load", async () => {
      checkRedirectNotice();

      try {
        const cached = LiffAuth.getUser();
        if (cached && cached.isLoggedIn) {
          window.location.href = getRedirectUrl();
          return;
        }

        if (typeof liff !== "undefined") {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            window.location.href = getRedirectUrl();
          }
        }
      } catch (err) {
        console.warn("Auto-login check warning:", err);
      }
    });
  </script>
</body>

</html>
